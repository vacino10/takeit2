# Stáhne fotky věcí (Unsplash, licence Unsplash) do web/photos/, aby web i grafika
# nezávisely na cizím serveru. Spouští se při změně tohoto souboru nebo ručně.
name: Fotky → web/photos

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout fotky
        run: |
          mkdir -p web/photos
          while read name id; do
            [ -z "$name" ] && continue
            curl -fsSL "https://images.unsplash.com/${id}?w=900&q=78&auto=format&fit=crop&fm=jpg" -o "web/photos/${name}.jpg"
            echo "$name: $(stat -c%s web/photos/${name}.jpg) B"
          done <<'LIST'
          sofa photo-1555041469-a586c61ea9bc
          bike photo-1485965120184-e220f721d03e
          monitor photo-1527443224154-c4a3942d3acf
          coffee photo-1517668808822-9ebb02f2a0e6
          plant photo-1614594975525-e45190c55d0b
          lamp photo-1507473885765-e6ed057f782c
          books photo-1512820790803-83ca734da794
          jacket photo-1551028719-00167b16eac5
          teddy photo-1559454403-b8fb88521f11
          chair photo-1503602642458-232111445657
          phones photo-1505740420928-5e560c06d30e
          mugs photo-1514228742587-6b1558fcca3d
          LIST
          printf 'Fotky z unsplash.com (Unsplash License, https://unsplash.com/license).\n' > web/photos/LICENSE.txt
      - name: Uložit do repa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/photos
          git diff --cached --quiet && echo "Beze změn" || (git commit -m "Fotky věcí do web/photos" && git push)
